<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Proximity VC</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;line-height:1.6}
  button{font-size:16px;padding:10px 20px;cursor:pointer}
  code{background:#8882;padding:2px 6px;border-radius:4px;font-size:1.1em}
  #info{display:none}
  .peer{display:flex;justify-content:space-between;border-bottom:1px solid #8884;padding:4px 0}
</style>
</head>
<body>
<h1>Minecraft VC</h1>
<button id="join">マイクを許可して参加</button>
<div id="info">
  <p>1. Minecraft内で次のコマンドを実行してください:</p>
  <p><code id="cmd"></code></p>
  <p id="status">接続中…</p>
  <div id="peers"></div>
</div>
<script>
var ctx, ws, myId, localStream;
var peers = {}; // id -> {pc, gain, pan}
var ICE = { iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }] };

document.getElementById("join").onclick = async function () {
  ctx = new AudioContext();
  localStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  this.style.display = "none";
  document.getElementById("info").style.display = "block";
  ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/ws");
  ws.onmessage = onMessage;
  ws.onclose = function () { document.getElementById("status").textContent = "切断されました。再読み込みしてください。"; };
};

function send(o) { ws.send(JSON.stringify(o)); }

async function onMessage(e) {
  var m = JSON.parse(e.data);
  if (m.type === "hello") {
    myId = m.id;
    document.getElementById("cmd").textContent = "/tag @s add vc_" + m.code;
    m.others.forEach(function (id) { createPeer(id, true); });
  } else if (m.type === "signal") {
    var p = peers[m.from] || createPeer(m.from, false);
    var d = m.data;
    if (d.sdp) {
      await p.pc.setRemoteDescription(d.sdp);
      if (d.sdp.type === "offer") {
        await p.pc.setLocalDescription(await p.pc.createAnswer());
        send({ type: "signal", to: m.from, data: { sdp: p.pc.localDescription } });
      }
    } else if (d.candidate) {
      try { await p.pc.addIceCandidate(d.candidate); } catch (_) {}
    }
  } else if (m.type === "left") {
    var q = peers[m.id];
    if (q) { q.pc.close(); delete peers[m.id]; }
  } else if (m.type === "state") {
    document.getElementById("status").textContent = m.name
      ? "リンク済み: " + m.name
      : "未リンク — Minecraft内でコマンドを実行してください";
    var html = "";
    m.peers.forEach(function (s) {
      var p = peers[s.id];
      if (p) {
        p.gain.gain.value = s.vol;
        p.pan.pan.value = Math.max(-1, Math.min(1, s.pan));
      }
      html += '<div class="peer"><span>' + s.id.slice(0, 6) + '</span><span>' + Math.round(s.vol * 100) + '%</span></div>';
    });
    document.getElementById("peers").innerHTML = html;
  }
}

function createPeer(id, initiator) {
  var pc = new RTCPeerConnection(ICE);
  var gain = ctx.createGain(); gain.gain.value = 0;
  var pan = ctx.createStereoPanner();
  gain.connect(pan); pan.connect(ctx.destination);
  peers[id] = { pc: pc, gain: gain, pan: pan };

  localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });
  pc.onicecandidate = function (e) {
    if (e.candidate) send({ type: "signal", to: id, data: { candidate: e.candidate } });
  };
  pc.ontrack = function (e) {
    var stream = e.streams[0];
    var a = new Audio(); a.srcObject = stream; a.muted = true; // Chrome対策
    ctx.createMediaStreamSource(stream).connect(gain);
  };
  if (initiator) {
    pc.onnegotiationneeded = async function () {
      await pc.setLocalDescription(await pc.createOffer());
      send({ type: "signal", to: id, data: { sdp: pc.localDescription } });
    };
  }
  return peers[id];
}
</script>
</body>
</html>
